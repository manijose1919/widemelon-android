name: WideMelon Debug APK

# Builds an installable debug APK without release keystore secrets.
# Artifacts are uploaded for download; prefer this over committing APKs to git.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build GitHubProd debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WideMelonDS-debug
          path: app/build/outputs/apk/gitHubProd/debug/app-gitHub-prod-debug.apk
          if-no-files-found: error
